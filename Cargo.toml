[package]
name = "hubp"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["stream", "json", "http2", "rustls-tls", "brotli", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
regex = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
http = "1.0"
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
futures-util = "0.3"
bytes = "1.0"
dashmap = "6.0"
chrono = "0.4"
ipnet = "2.9"
maxminddb = "0.24"
tower = "0.4"
matchit = "0.7"
hyper = { version = "1.0", features = ["full"] }
sync_wrapper = "1.0"

[profile.release]
opt-level = 'z'     # 优化二进制体积
lto = true          # 开启链接时优化
codegen-units = 1   # 降低并行度以获得更好的优化效果
strip = true        # 自动剥离符号信息
panic = 'abort'     # 发生 panic 时直接退出，减少标准库体积
